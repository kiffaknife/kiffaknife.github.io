---
layout: default
---

<div class="main">

  <h1 class="page-heading">Блог
    <a href='{{ "/feed.xml" | prepend: site.baseurl }}'><img src="/img/rss.png" height="16"></a>
  </h1>

  <ul class="post-list">
    {% assign posts_by_date = site.blog | sort: "date" | reverse %}
    {% for post in posts_by_date %}
      <li class="post">
        <h2 class="post-title">
          <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        </h2>
        <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
      </li>
    {% endfor %}
  </ul>


</div>
